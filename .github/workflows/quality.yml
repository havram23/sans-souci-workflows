name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Generate inactive n8n templates
        run: python tools/build_n8n.py
      - name: Test local transformations and delivery queue
        run: python -m unittest discover -s tests -v
      - name: Execute n8n Code node tests
        run: node --test tests/n8n.test.cjs
      - name: Build static library and downloads
        run: |
          python tools/build_site.py
          python tools/build_downloads.py
          python tools/build_site.py
      - name: Verify public archive and site links
        run: python tools/check_release.py
